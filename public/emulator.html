<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroPolo Core</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #game { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      /*
       * Isolated EmulatorJS host.
       * EmulatorJS keeps global state and cannot be torn down cleanly, so the React Player
       * mounts this page in an <iframe> (one iframe per game session) and drives it via postMessage.
       *
       * Parent -> frame:  { type: 'init', core, gameUrl | romBlob, gameName, gameId, volume }
       *                   { type: 'cmd', id, cmd, arg }
       * Frame -> parent:  { type: 'ready' } { type: 'started' } { type: 'error', message }
       *                   { type: 'result', id, ok, data, error } { type: 'hotkey', key }
       */
      const EJS_CDN = 'https://cdn.emulatorjs.org/stable/data/';
      const post = (msg, transfer) => parent.postMessage(msg, location.origin, transfer || []);
      let started = false;

      const emu = () => window.EJS_emulator;
      const gm = () => emu() && emu().gameManager;

      function init(opts) {
        let gameUrl = opts.gameUrl;
        if (opts.romBlob) gameUrl = URL.createObjectURL(opts.romBlob);

        window.EJS_player = '#game';
        window.EJS_core = opts.core;
        window.EJS_gameUrl = gameUrl;
        window.EJS_gameName = opts.gameName || 'game';
        window.EJS_gameID = opts.gameId;
        window.EJS_pathtodata = EJS_CDN;
        window.EJS_startOnLoaded = true;
        window.EJS_color = '#a855f7';
        window.EJS_backgroundColor = '#000000';
        window.EJS_volume = typeof opts.volume === 'number' ? opts.volume : 0.8;
        window.EJS_disableDatabases = true;
        window.EJS_onGameStart = () => {
          started = true;
          post({ type: 'started' });
        };

        const s = document.createElement('script');
        s.src = EJS_CDN + 'loader.js';
        s.onerror = () => post({ type: 'error', message: 'Could not reach the EmulatorJS CDN (check your internet connection).' });
        document.body.appendChild(s);
      }

      function screenshot() {
        return new Promise((resolve, reject) => {
          const e = emu();
          if (!e) return reject(new Error('Emulator not ready'));
          try {
            e.screenshot((blob) => resolve(blob), undefined, 'png', 1);
          } catch (err) {
            // Fallback: grab the core canvas directly
            const c = document.querySelector('#game canvas');
            if (!c) return reject(err);
            c.toBlob((b) => (b ? resolve(b) : reject(err)), 'image/png');
          }
        });
      }

      async function run(cmd, arg) {
        const e = emu();
        const g = gm();
        if (!e || !g || !started) throw new Error('Emulator is still starting');
        switch (cmd) {
          case 'saveState': {
            const state = g.getState(); // Uint8Array
            return state.slice().buffer;
          }
          case 'loadState':
            g.loadState(new Uint8Array(arg));
            return true;
          case 'screenshot':
            return await screenshot();
          case 'setVolume':
            e.setVolume(arg);
            return true;
          case 'setSpeed': {
            // arg: 0.5 | 1 | 2 | 4 ...
            if (arg > 1) {
              g.toggleSlowMotion(0);
              g.setFastForwardRatio(arg);
              g.toggleFastForward(1);
            } else if (arg < 1) {
              g.toggleFastForward(0);
              g.setSlowMotionRatio(Math.round(1 / arg));
              g.toggleSlowMotion(1);
            } else {
              g.toggleFastForward(0);
              g.toggleSlowMotion(0);
            }
            return true;
          }
          case 'pause':
            e.pause(true);
            return true;
          case 'resume':
            e.play(true);
            return true;
          case 'restart':
            g.restart();
            return true;
          case 'input': {
            // arg: { index, value } using RetroPad indexes (0=B,1=Y,2=SELECT,3=START,4=UP,5=DOWN,6=LEFT,7=RIGHT,8=A,9=X,10=L,11=R)
            g.simulateInput(0, arg.index, arg.value);
            return true;
          }
          case 'focus':
            window.focus();
            return true;
          default:
            throw new Error('Unknown command ' + cmd);
        }
      }

      window.addEventListener('message', async (ev) => {
        if (ev.origin !== location.origin || ev.source !== parent) return;
        const msg = ev.data || {};
        if (msg.type === 'init') {
          init(msg);
        } else if (msg.type === 'cmd') {
          try {
            const data = await run(msg.cmd, msg.arg);
            post({ type: 'result', id: msg.id, ok: true, data }, data instanceof ArrayBuffer ? [data] : []);
          } catch (err) {
            post({ type: 'result', id: msg.id, ok: false, error: String((err && err.message) || err) });
          }
        }
      });

      // Forward player hotkeys to the React shell (keyboard focus lives inside this frame while playing)
      window.addEventListener(
        'keydown',
        (e) => {
          if (e.code === 'F5' || e.code === 'F8') {
            e.preventDefault();
            post({ type: 'hotkey', key: e.code });
          }
        },
        true,
      );

      post({ type: 'ready' });
    </script>
  </body>
</html>
